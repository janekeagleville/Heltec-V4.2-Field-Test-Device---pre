[platformio]
default_envs = cyd_st7789_noinv

[env]
platform = espressif32@6.9.0
board = esp32dev
; 3 MB na program: mapy (mapdata.h, maphires.h, mapwaw.h) zajmuja ok. 600 kB
board_build.partitions = huge_app.csv
framework = arduino
monitor_speed = 115200
lib_deps = bodmer/TFT_eSPI@2.5.43
build_flags =
  -D USER_SETUP_LOADED=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D USE_HSPI_PORT
  -D LOAD_GLCD
  -D LOAD_FONT2
  -D LOAD_FONT4
  -D SPI_FREQUENCY=27000000

[env:cyd_st7789]
build_flags = ${env.build_flags}
  -D ST7789_DRIVER
  -D TFT_RGB_ORDER=TFT_BGR
  -D TFT_INVERSION_ON
  -D SPI_MODE=3

[env:cyd_ili9341]
build_flags = ${env.build_flags}
  -D ILI9341_DRIVER

; Panele CYD 2.8" z dwoma USB bywaja ST7789 bez inwersji: gdy czern wychodzi jako biel
; (cyjan jako czerwien), uzyj tego srodowiska zamiast cyd_st7789.
[env:cyd_st7789_noinv]
build_flags = ${env.build_flags}
  -D ST7789_DRIVER
  -D TFT_RGB_ORDER=TFT_BGR
  -D TFT_INVERSION_OFF
  -D SPI_MODE=3
